<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a202c"/>
      <stop offset="100%" style="stop-color:#2d3748"/>
    </linearGradient>
    <linearGradient id="mascAnimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4299e1"/>
      <stop offset="100%" style="stop-color:#3182ce"/>
    </linearGradient>
    <linearGradient id="mascInanimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#63b3ed"/>
      <stop offset="100%" style="stop-color:#4299e1"/>
    </linearGradient>
    <linearGradient id="femGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ed64a6"/>
      <stop offset="100%" style="stop-color:#d53f8c"/>
    </linearGradient>
    <linearGradient id="neutGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#48bb78"/>
      <stop offset="100%" style="stop-color:#38a169"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ecc94b"/>
      <stop offset="100%" style="stop-color:#d69e2e"/>
    </linearGradient>
  </defs>

  <!-- Main card background -->
  <rect x="20" y="20" width="960" height="540" rx="20" fill="url(#cardBg)" filter="url(#shadow)"/>

  <!-- Header -->
  <text x="500" y="58" text-anchor="middle" font-size="26" font-weight="bold" fill="white">Genitive Singular Cheat Sheet</text>
  <text x="500" y="82" text-anchor="middle" font-size="14" fill="#a0aec0">Koho? Čeho? • Possession, prepositions (z, do, od, bez, u), quantities</text>

  <!-- Divider line -->
  <line x1="50" y1="100" x2="950" y2="100" stroke="#4a5568" stroke-width="1"/>

  <!-- Info Box -->
  <rect x="35" y="110" width="920" height="45" rx="10" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <text x="500" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">ALL GENDERS CHANGE! Masc: -a/-e/-u | Fem: -y/-e/-i | Neut: -a/-e/-í</text>

  <!-- Four columns -->

  <!-- Column 1: Masculine Animate -->
  <rect x="35" y="170" width="220" height="370" rx="12" fill="#1a202c" stroke="url(#mascAnimGrad)" stroke-width="3"/>
  <rect x="35" y="170" width="220" height="45" rx="12" fill="url(#mascAnimGrad)"/>
  <rect x="35" y="203" width="220" height="12" fill="url(#mascAnimGrad)"/>
  <text x="145" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="white">MASC ANIMATE</text>

  <text x="145" y="245" text-anchor="middle" font-size="22" font-weight="bold" fill="#4299e1">-a</text>
  <text x="145" y="263" text-anchor="middle" font-size="11" fill="#a0aec0">hard stem</text>
  <text x="55" y="285" font-size="12" fill="#e2e8f0">student → student<tspan fill="#4299e1" font-weight="bold">a</tspan></text>
  <text x="55" y="303" font-size="12" fill="#e2e8f0">bratr → bratr<tspan fill="#4299e1" font-weight="bold">a</tspan></text>
  <text x="55" y="321" font-size="12" fill="#e2e8f0">pes → ps<tspan fill="#4299e1" font-weight="bold">a</tspan></text>

  <line x1="55" y1="340" x2="235" y2="340" stroke="#4a5568" stroke-width="1"/>

  <text x="145" y="365" text-anchor="middle" font-size="22" font-weight="bold" fill="#4299e1">-e</text>
  <text x="145" y="383" text-anchor="middle" font-size="11" fill="#a0aec0">soft stem (ž, š, č, ř, c, tel)</text>
  <text x="55" y="405" font-size="12" fill="#e2e8f0">muž → muž<tspan fill="#4299e1" font-weight="bold">e</tspan></text>
  <text x="55" y="423" font-size="12" fill="#e2e8f0">učitel → učitel<tspan fill="#4299e1" font-weight="bold">e</tspan></text>
  <text x="55" y="441" font-size="12" fill="#e2e8f0">otec → otc<tspan fill="#4299e1" font-weight="bold">e</tspan></text>

  <rect x="50" y="460" width="190" height="70" rx="8" fill="#2d3748"/>
  <text x="145" y="480" text-anchor="middle" font-size="11" fill="#a0aec0">Examples:</text>
  <text x="145" y="498" text-anchor="middle" font-size="11" fill="#63b3ed">bez student<tspan font-weight="bold">a</tspan></text>
  <text x="145" y="516" text-anchor="middle" font-size="11" fill="#63b3ed">od učitel<tspan font-weight="bold">e</tspan></text>

  <!-- Column 2: Masculine Inanimate -->
  <rect x="265" y="170" width="220" height="370" rx="12" fill="#1a202c" stroke="url(#mascInanimGrad)" stroke-width="3"/>
  <rect x="265" y="170" width="220" height="45" rx="12" fill="url(#mascInanimGrad)"/>
  <rect x="265" y="203" width="220" height="12" fill="url(#mascInanimGrad)"/>
  <text x="375" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="white">MASC INANIMATE</text>

  <text x="375" y="245" text-anchor="middle" font-size="22" font-weight="bold" fill="#63b3ed">-u</text>
  <text x="375" y="263" text-anchor="middle" font-size="11" fill="#a0aec0">hard stem</text>
  <text x="285" y="285" font-size="12" fill="#e2e8f0">hrad → hrad<tspan fill="#63b3ed" font-weight="bold">u</tspan></text>
  <text x="285" y="303" font-size="12" fill="#e2e8f0">dům → dom<tspan fill="#63b3ed" font-weight="bold">u</tspan></text>
  <text x="285" y="321" font-size="12" fill="#e2e8f0">obchod → obchod<tspan fill="#63b3ed" font-weight="bold">u</tspan></text>

  <line x1="285" y1="340" x2="465" y2="340" stroke="#4a5568" stroke-width="1"/>

  <text x="375" y="365" text-anchor="middle" font-size="22" font-weight="bold" fill="#63b3ed">-e</text>
  <text x="375" y="383" text-anchor="middle" font-size="11" fill="#a0aec0">soft stem (j, ž, š, č)</text>
  <text x="285" y="405" font-size="12" fill="#e2e8f0">stroj → stroj<tspan fill="#63b3ed" font-weight="bold">e</tspan></text>
  <text x="285" y="423" font-size="12" fill="#e2e8f0">pokoj → pokoj<tspan fill="#63b3ed" font-weight="bold">e</tspan></text>
  <text x="285" y="441" font-size="12" fill="#e2e8f0">počítač → počítač<tspan fill="#63b3ed" font-weight="bold">e</tspan></text>

  <rect x="280" y="460" width="190" height="70" rx="8" fill="#2d3748"/>
  <text x="375" y="480" text-anchor="middle" font-size="11" fill="#a0aec0">Examples:</text>
  <text x="375" y="498" text-anchor="middle" font-size="11" fill="#63b3ed">z hrad<tspan font-weight="bold">u</tspan></text>
  <text x="375" y="516" text-anchor="middle" font-size="11" fill="#63b3ed">do obchod<tspan font-weight="bold">u</tspan></text>

  <!-- Column 3: Feminine -->
  <rect x="495" y="170" width="220" height="370" rx="12" fill="#1a202c" stroke="url(#femGrad)" stroke-width="3"/>
  <rect x="495" y="170" width="220" height="45" rx="12" fill="url(#femGrad)"/>
  <rect x="495" y="203" width="220" height="12" fill="url(#femGrad)"/>
  <text x="605" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="white">FEMININE</text>

  <text x="605" y="245" text-anchor="middle" font-size="22" font-weight="bold" fill="#ed64a6">-a → -y</text>
  <text x="605" y="263" text-anchor="middle" font-size="11" fill="#a0aec0">hard stem</text>
  <text x="515" y="285" font-size="12" fill="#e2e8f0">žena → žen<tspan fill="#ed64a6" font-weight="bold">y</tspan></text>
  <text x="515" y="303" font-size="12" fill="#e2e8f0">kniha → knih<tspan fill="#ed64a6" font-weight="bold">y</tspan></text>
  <text x="515" y="321" font-size="12" fill="#e2e8f0">Praha → Prah<tspan fill="#ed64a6" font-weight="bold">y</tspan></text>

  <line x1="515" y1="340" x2="695" y2="340" stroke="#4a5568" stroke-width="1"/>

  <text x="605" y="360" text-anchor="middle" font-size="18" font-weight="bold" fill="#ed64a6">-e → -e</text>
  <text x="605" y="376" text-anchor="middle" font-size="10" fill="#a0aec0">(no change)</text>
  <text x="515" y="395" font-size="12" fill="#e2e8f0">růže → růž<tspan fill="#ed64a6" font-weight="bold">e</tspan></text>

  <line x1="515" y1="410" x2="695" y2="410" stroke="#4a5568" stroke-width="1"/>

  <text x="605" y="430" text-anchor="middle" font-size="18" font-weight="bold" fill="#ed64a6">cons → -i</text>
  <text x="515" y="455" font-size="12" fill="#e2e8f0">věc → věc<tspan fill="#ed64a6" font-weight="bold">i</tspan></text>
  <text x="515" y="473" font-size="12" fill="#e2e8f0">noc → noc<tspan fill="#ed64a6" font-weight="bold">i</tspan></text>

  <rect x="510" y="490" width="190" height="40" rx="8" fill="#2d3748"/>
  <text x="605" y="515" text-anchor="middle" font-size="11" fill="#f687b3">z Prahy, do školy</text>

  <!-- Column 4: Neuter -->
  <rect x="725" y="170" width="220" height="370" rx="12" fill="#1a202c" stroke="url(#neutGrad)" stroke-width="3"/>
  <rect x="725" y="170" width="220" height="45" rx="12" fill="url(#neutGrad)"/>
  <rect x="725" y="203" width="220" height="12" fill="url(#neutGrad)"/>
  <text x="835" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="white">NEUTER</text>

  <text x="835" y="245" text-anchor="middle" font-size="22" font-weight="bold" fill="#48bb78">-o → -a</text>
  <text x="835" y="263" text-anchor="middle" font-size="11" fill="#a0aec0">most common</text>
  <text x="745" y="285" font-size="12" fill="#e2e8f0">město → měst<tspan fill="#48bb78" font-weight="bold">a</tspan></text>
  <text x="745" y="303" font-size="12" fill="#e2e8f0">auto → aut<tspan fill="#48bb78" font-weight="bold">a</tspan></text>
  <text x="745" y="321" font-size="12" fill="#e2e8f0">pivo → piv<tspan fill="#48bb78" font-weight="bold">a</tspan></text>

  <line x1="745" y1="340" x2="925" y2="340" stroke="#4a5568" stroke-width="1"/>

  <text x="835" y="360" text-anchor="middle" font-size="18" font-weight="bold" fill="#48bb78">-e → -e</text>
  <text x="835" y="376" text-anchor="middle" font-size="10" fill="#a0aec0">(no change)</text>
  <text x="745" y="395" font-size="12" fill="#e2e8f0">moře → moř<tspan fill="#48bb78" font-weight="bold">e</tspan></text>
  <text x="745" y="413" font-size="12" fill="#e2e8f0">srdce → srdc<tspan fill="#48bb78" font-weight="bold">e</tspan></text>

  <line x1="745" y1="428" x2="925" y2="428" stroke="#4a5568" stroke-width="1"/>

  <text x="835" y="448" text-anchor="middle" font-size="18" font-weight="bold" fill="#48bb78">-í → -í</text>
  <text x="835" y="464" text-anchor="middle" font-size="10" fill="#a0aec0">(no change)</text>
  <text x="745" y="485" font-size="12" fill="#e2e8f0">nádraží → nádraž<tspan fill="#48bb78" font-weight="bold">í</tspan></text>

  <rect x="740" y="500" width="190" height="30" rx="8" fill="#2d3748"/>
  <text x="835" y="520" text-anchor="middle" font-size="11" fill="#68d391">z města, do kina</text>
</svg>
