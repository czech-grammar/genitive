<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 580" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a202c"/>
      <stop offset="100%" style="stop-color:#2d3748"/>
    </linearGradient>
    <linearGradient id="mascGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4299e1"/>
      <stop offset="100%" style="stop-color:#3182ce"/>
    </linearGradient>
    <linearGradient id="femGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ed64a6"/>
      <stop offset="100%" style="stop-color:#d53f8c"/>
    </linearGradient>
    <linearGradient id="neutGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#48bb78"/>
      <stop offset="100%" style="stop-color:#38a169"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ecc94b"/>
      <stop offset="100%" style="stop-color:#d69e2e"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#805ad5"/>
      <stop offset="100%" style="stop-color:#6b46c1"/>
    </linearGradient>
  </defs>

  <!-- Main card background -->
  <rect x="20" y="20" width="910" height="540" rx="20" fill="url(#cardBg)" filter="url(#shadow)"/>

  <!-- Header -->
  <text x="475" y="55" text-anchor="middle" font-size="26" font-weight="bold" fill="white">Genitive Plural Cheat Sheet</text>
  <text x="475" y="78" text-anchor="middle" font-size="14" fill="#a0aec0">Used after numbers 5+: pět studentů, mnoho knih, kolik měst?</text>

  <!-- Divider line -->
  <line x1="50" y1="95" x2="900" y2="95" stroke="#4a5568" stroke-width="1"/>

  <!-- Key Pattern Box -->
  <rect x="35" y="105" width="870" height="55" rx="10" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <text x="475" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">THREE ENDINGS: Masculine = -ů | Fem/Neut -a/-o = ZERO (∅) | Soft = -í</text>
  <text x="475" y="148" text-anchor="middle" font-size="12" fill="#744210">The most complex case! But patterns are predictable.</text>

  <!-- Three columns -->

  <!-- Column 1: Masculine -ů (EASY!) -->
  <rect x="35" y="175" width="280" height="365" rx="12" fill="#1a202c" stroke="url(#mascGrad)" stroke-width="3"/>
  <rect x="35" y="175" width="280" height="50" rx="12" fill="url(#mascGrad)"/>
  <rect x="35" y="213" width="280" height="12" fill="url(#mascGrad)"/>
  <text x="175" y="207" text-anchor="middle" font-size="16" font-weight="bold" fill="white">MASCULINE → -ů</text>

  <text x="175" y="255" text-anchor="middle" font-size="32" font-weight="bold" fill="#4299e1">-ů</text>
  <text x="175" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#68d391">ALL masculine use this!</text>

  <text x="55" y="310" font-size="13" fill="#a0aec0">Animate:</text>
  <text x="55" y="330" font-size="12" fill="#e2e8f0">student → student<tspan fill="#4299e1" font-weight="bold">ů</tspan></text>
  <text x="55" y="348" font-size="12" fill="#e2e8f0">muž → muž<tspan fill="#4299e1" font-weight="bold">ů</tspan></text>
  <text x="55" y="366" font-size="12" fill="#e2e8f0">pes → ps<tspan fill="#4299e1" font-weight="bold">ů</tspan></text>

  <line x1="55" y1="382" x2="295" y2="382" stroke="#4a5568" stroke-width="1"/>

  <text x="55" y="402" font-size="13" fill="#a0aec0">Inanimate:</text>
  <text x="55" y="422" font-size="12" fill="#e2e8f0">hrad → hrad<tspan fill="#4299e1" font-weight="bold">ů</tspan></text>
  <text x="55" y="440" font-size="12" fill="#e2e8f0">dům → dom<tspan fill="#4299e1" font-weight="bold">ů</tspan></text>
  <text x="55" y="458" font-size="12" fill="#e2e8f0">pokoj → pokoj<tspan fill="#4299e1" font-weight="bold">ů</tspan></text>

  <rect x="50" y="480" width="250" height="50" rx="8" fill="#2d3748"/>
  <text x="175" y="500" text-anchor="middle" font-size="11" fill="#a0aec0">Examples:</text>
  <text x="175" y="518" text-anchor="middle" font-size="12" fill="#63b3ed">pět student<tspan font-weight="bold">ů</tspan>, mnoho muž<tspan font-weight="bold">ů</tspan></text>

  <!-- Column 2: Feminine -->
  <rect x="325" y="175" width="280" height="365" rx="12" fill="#1a202c" stroke="url(#femGrad)" stroke-width="3"/>
  <rect x="325" y="175" width="280" height="50" rx="12" fill="url(#femGrad)"/>
  <rect x="325" y="213" width="280" height="12" fill="url(#femGrad)"/>
  <text x="465" y="207" text-anchor="middle" font-size="16" font-weight="bold" fill="white">FEMININE</text>

  <text x="465" y="255" text-anchor="middle" font-size="26" font-weight="bold" fill="#ed64a6">-a → ∅ (zero)</text>
  <text x="465" y="275" text-anchor="middle" font-size="11" fill="#a0aec0">Remove the -a completely!</text>
  <text x="345" y="298" font-size="12" fill="#e2e8f0">žena → žen<tspan fill="#ed64a6" font-weight="bold"> (∅)</tspan></text>
  <text x="345" y="316" font-size="12" fill="#e2e8f0">kniha → knih<tspan fill="#ed64a6" font-weight="bold"> (∅)</tspan></text>
  <text x="345" y="334" font-size="12" fill="#e2e8f0">hodina → hodin<tspan fill="#ed64a6" font-weight="bold"> (∅)</tspan></text>

  <line x1="345" y1="352" x2="585" y2="352" stroke="#4a5568" stroke-width="1"/>

  <text x="465" y="375" text-anchor="middle" font-size="22" font-weight="bold" fill="#ed64a6">-e/-cons → -í</text>
  <text x="345" y="398" font-size="12" fill="#e2e8f0">růže → růž<tspan fill="#ed64a6" font-weight="bold">í</tspan></text>
  <text x="345" y="416" font-size="12" fill="#e2e8f0">práce → prác<tspan fill="#ed64a6" font-weight="bold">í</tspan></text>
  <text x="345" y="434" font-size="12" fill="#e2e8f0">noc → noc<tspan fill="#ed64a6" font-weight="bold">í</tspan></text>
  <text x="345" y="452" font-size="12" fill="#e2e8f0">věc → věc<tspan fill="#ed64a6" font-weight="bold">í</tspan></text>

  <rect x="340" y="475" width="250" height="55" rx="8" fill="#2d3748"/>
  <text x="465" y="495" text-anchor="middle" font-size="11" fill="#a0aec0">Examples:</text>
  <text x="465" y="513" text-anchor="middle" font-size="12" fill="#f687b3">pět žen, mnoho knih</text>

  <!-- Column 3: Neuter -->
  <rect x="615" y="175" width="280" height="365" rx="12" fill="#1a202c" stroke="url(#neutGrad)" stroke-width="3"/>
  <rect x="615" y="175" width="280" height="50" rx="12" fill="url(#neutGrad)"/>
  <rect x="615" y="213" width="280" height="12" fill="url(#neutGrad)"/>
  <text x="755" y="207" text-anchor="middle" font-size="16" font-weight="bold" fill="white">NEUTER</text>

  <text x="755" y="255" text-anchor="middle" font-size="26" font-weight="bold" fill="#48bb78">-o → ∅ (zero)</text>
  <text x="755" y="275" text-anchor="middle" font-size="11" fill="#a0aec0">Remove the -o completely!</text>
  <text x="635" y="298" font-size="12" fill="#e2e8f0">město → měst<tspan fill="#48bb78" font-weight="bold"> (∅)</tspan></text>
  <text x="635" y="316" font-size="12" fill="#e2e8f0">slovo → slov<tspan fill="#48bb78" font-weight="bold"> (∅)</tspan></text>
  <text x="635" y="334" font-size="12" fill="#e2e8f0">auto → aut<tspan fill="#48bb78" font-weight="bold"> (∅)</tspan></text>

  <line x1="635" y1="352" x2="875" y2="352" stroke="#4a5568" stroke-width="1"/>

  <text x="755" y="375" text-anchor="middle" font-size="22" font-weight="bold" fill="#48bb78">-e → -í</text>
  <text x="635" y="398" font-size="12" fill="#e2e8f0">moře → moř<tspan fill="#48bb78" font-weight="bold">í</tspan></text>
  <text x="635" y="416" font-size="12" fill="#e2e8f0">pole → pol<tspan fill="#48bb78" font-weight="bold">í</tspan></text>
  <text x="635" y="434" font-size="12" fill="#e2e8f0">srdce → srdc<tspan fill="#48bb78" font-weight="bold">í</tspan></text>

  <text x="755" y="462" text-anchor="middle" font-size="14" fill="#a0aec0">-í → -í (no change)</text>
  <text x="755" y="478" text-anchor="middle" font-size="11" fill="#718096">nádraží → nádraží</text>

  <rect x="630" y="495" width="250" height="35" rx="8" fill="#2d3748"/>
  <text x="755" y="518" text-anchor="middle" font-size="12" fill="#68d391">pět měst, šest aut</text>
</svg>
